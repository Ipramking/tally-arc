version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /studio
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /contracts
    schedule:
      interval: weekly
    # The registry is deployed immutably; OpenZeppelin is pinned on purpose.
    # Review upgrades by hand before changing it.
    ignore:
      - dependency-name: "@openzeppelin/contracts"
