<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tally</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="tally-head">
      <div class="tally-logo">
        <span class="mark"></span>
        <span class="name">TALLY</span>
      </div>
      <span class="net">Arc Mainnet &middot; 5042</span>
    </header>

    <p class="sub">Pre-flight contract provenance. Check before you sign.</p>

    <div class="row">
      <input
        id="addr"
        type="text"
        placeholder="0x… contract address"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="check">Check</button>
    </div>

    <div class="presets">
      <span class="presets-label">1-click demo:</span>
      <button class="preset" data-preset="VERIFIED">Verified contract</button>
      <button class="preset" data-preset="UNVERIFIED">Unverified spender</button>
    </div>

    <div id="result" class="result hidden"></div>

    <footer>
      <a id="studioLink" href="#" target="_blank">Open Tally Studio →</a>
    </footer>

    <script src="../config.js"></script>
    <script src="../lib/registry.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
