<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tally</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="tally-head">
      <div class="tally-logo">
        <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="5" y1="4" x2="5" y2="20" />
            <line x1="10" y1="4" x2="10" y2="20" />
            <line x1="15" y1="4" x2="15" y2="20" />
            <line x1="20" y1="4" x2="20" y2="20" />
            <line x1="3" y1="19" x2="22" y2="5" />
          </g>
        </svg>
        <span class="name">TALLY</span>
      </div>
      <label class="net" for="chain">
        <span class="sr-only">Network</span>
        <select id="chain"></select>
      </label>
    </header>

    <p class="sub">Contract provenance, checked before you sign.</p>

    <form id="form" class="row" autocomplete="off">
      <input
        id="addr"
        type="text"
        placeholder="0x&hellip; contract address"
        aria-label="Contract address"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="check" type="submit">Check</button>
    </form>

    <div id="presets" class="presets hidden">
      <span class="presets-label">Try:</span>
      <button class="preset" type="button" data-preset="verified">Registered contract</button>
      <button class="preset" type="button" data-preset="unverified">Unregistered address</button>
    </div>

    <div id="result" class="result hidden" role="status" aria-live="polite"></div>

    <footer>
      <a id="studioLink" href="#" target="_blank" rel="noopener noreferrer">Open Tally Studio &rarr;</a>
    </footer>

    <script src="../chains.generated.js"></script>
    <script src="../lib/net.js"></script>
    <script src="../lib/safe-url.js"></script>
    <script src="../lib/registry.js"></script>
    <script src="../lib/repo-proof.js"></script>
    <script src="../lib/status.js"></script>
    <script src="../lib/lookup.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
